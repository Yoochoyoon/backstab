<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>진행자 - Backstab</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 방 만들기 전: Figma 랜딩 화면 -->
  <section id="createSection" class="hero hero--stack">
    <div class="hero-card"></div>
    <img class="hero-fist" src="/assets/fist.webp" alt="" />
    <h1 class="hero-title">BACKSTAB</h1>
    <button id="createRoomBtn" class="hero-cta">새 방 만들기</button>
  </section>

  <!-- 방 생성 후 대기실 -->
  <section id="lobbySection" class="hero lobby-hero" style="display: none">
    <div class="hero-card"></div>
    <h2 class="lobby-title">입장한 플레이어</h2>
    <div class="lobby-grid" id="playerList">
      <ul class="lobby-row" id="lobbyRowTop"></ul>
      <ul class="lobby-row" id="lobbyRowBottom"></ul>
    </div>
    <div class="lobby-code">
      <span class="lobby-code__label">방코드</span>
      <span class="lobby-code__value" id="roomCode">----</span>
    </div>
    <button id="startBtn" class="lobby-start-btn" disabled>시작</button>
    <p class="error lobby-error" id="errorLabel"></p>
  </section>

  <!-- 게임 진행 화면 -->
  <section id="gameControlSection" class="host-layout" style="display: none" data-phase="lobby">
    <div class="tv-upper">
      <header class="case-header">
        <span class="case-header__label">사건 기록 · BACKSTAB</span>
        <h1>진행 상황</h1>
        <div class="phase-status">
          <span class="phase-label" id="phaseLabel">대기실</span>
          <span class="countdown" id="timerLabel"></span>
        </div>
      </header>

      <div class="boss-case-file" id="bossBanner" style="display: none">
        <span class="boss-case-file__label">지명수배 · 보스</span>
        <div class="boss-case-file__name" id="bossName"></div>
        <div class="boss-case-file__hp">위험 상태 감시 중</div>
      </div>

      <div class="player-file-grid" id="playerGrid"></div>
    </div>

    <div class="control-lower">
      <div id="winnerLabel" style="display: none"></div>
      <div id="resultLog"></div>
      <ul class="player-list" id="gamePlayerList"></ul>
      <button id="advanceBtn">다음 단계로 (강제 진행)</button>
      <button id="extendBtn">시간 연장</button>
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared.js"></script>
  <script src="/host.js"></script>
</body>
</html>
