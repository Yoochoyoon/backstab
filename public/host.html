<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>진행자 - Backstab</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .host-layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      gap: 12px;
      padding: 12px;
      box-sizing: border-box;
      background: linear-gradient(135deg, #3d1a1a 0%, #5d2e2e 50%, #4a2424 100%);
    }
    .tv-upper {
      flex: 2;
      overflow-y: auto;
      background: linear-gradient(135deg, #4a2424 0%, #6b3030 50%, #5d2e2e 100%);
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 20px 20px;
      padding: 16px;
      border-radius: 8px;
      border: 2px solid #8B5A2B;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }
    .control-lower {
      flex: 1;
      overflow-y: auto;
      background: linear-gradient(135deg, #3d1a1a 0%, #5d2e2e 100%);
      padding: 16px;
      border-radius: 8px;
      border: 2px solid #8B5A2B;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }
    .tv-upper h1 { margin-top: 0; color: #ffffff; font-weight: 900; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
    .tv-upper h2 { color: #FFD700; font-weight: 700; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
    .tv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-top: 16px; }
    .tv-player-card {
      background: rgba(0,0,0,0.3);
      padding: 12px;
      border-radius: 4px;
      text-align: center;
      border: 2px solid #FFD700;
      box-shadow: 0 0 10px rgba(255,215,0,0.3);
    }
    .tv-player-name { font-weight: 700; color: #ffffff; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
    .tv-player-hp { font-size: 0.9rem; color: #FFD700; margin-top: 4px; font-weight: 600; }

    /* 버튼 스타일 */
    button {
      background: rgba(255,215,0,0.1);
      color: #FFD700;
      border: 2px solid #FFD700;
      padding: 10px 16px;
      border-radius: 4px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    button:hover:not(:disabled) {
      background: rgba(255,215,0,0.2);
      box-shadow: 0 0 15px rgba(255,215,0,0.5);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 제목 텍스트 */
    h3 { color: #ffffff; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
    .muted { color: #CCB896; }
    .error { color: #FF6B6B; }
  </style>
</head>
<body>
  <div class="host-layout" data-phase="lobby">
    <!-- TV 화면 (위쪽, 크게) -->
    <div class="tv-upper">
      <header class="case-header">
        <span class="case-header__label">CONFIDENTIAL CASE FILE</span>
        <h1 id="titleLabel">Backstab</h1>
        <div class="phase-status">
          <span id="roundLabel" class="round-label"></span>
          <span id="phaseLabel" class="phase-label"></span>
          <strong id="timerLabel" class="countdown"></strong>
        </div>
      </header>

      <div id="bossBanner" class="boss-case-file" style="display:none; margin: 16px 0;">
        <span class="muted">보스 공개</span>
        <div id="bossName" style="font-size:2rem; font-weight:700; color:#f2c94c;"></div>
      </div>

      <div class="event-report" aria-live="polite">
        <div id="resultLog" class="event-report__content" style="font-size:1.2rem; margin: 12px 0; color: #e0e0e0;"></div>
      </div>
      <div id="winnerLabel" style="font-size:1.5rem; font-weight:700; display:none; color:#f2c94c;"></div>

      <div class="tv-grid player-file-grid" id="playerGrid" aria-label="생존자 명단"></div>
    </div>

    <!-- 진행자 컨트롤 (아래쪽, 작게) -->
    <div class="control-lower">
      <div id="createSection">
        <button id="createRoomBtn">방 만들기</button>
      </div>

      <div id="lobbySection" style="display:none">
        <h3>방 코드: <span id="roomCode" style="color:#f2c94c; font-weight:700;"></span></h3>
        <p class="muted">플레이어들은 /player 에서 이 코드로 입장합니다.</p>
        <ul id="playerList" class="player-list"></ul>
        <button id="startBtn" disabled>시작 (6~10명 필요)</button>
      </div>

      <div id="gameControlSection" style="display:none">
        <ul id="gamePlayerList" class="player-list"></ul>
        <div style="margin-top: 12px;">
          <button id="advanceBtn">다음 단계로 (강제 진행)</button>
          <button id="extendBtn" class="secondary">시간 연장 (+1분)</button>
        </div>
      </div>

      <p class="error" id="errorLabel"></p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared.js"></script>
  <script src="/host.js"></script>
</body>
</html>
