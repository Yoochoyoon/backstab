<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>진행자 - Backstab</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* ============================================
       CSS-ONLY 요소: 배경, 질감, 대각선, 로고, 버튼
       이미지 에셋: halftone-fist.svg, halftone-silhouette.svg
       ============================================ */

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ========== CSS: 버건디 배경 ========== */
    body {
      background: linear-gradient(135deg, #5D2E2E 0%, #8B4545 50%, #5D2E2E 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* ========== CSS: 종이 질감 (물결 무늬) ========== */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.02) 2px, rgba(255,255,255,0.02) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(0,0,0,0.05) 3px, rgba(0,0,0,0.05) 6px),
        linear-gradient(45deg, rgba(139,69,69,0.2) 0%, transparent 50%, rgba(139,69,69,0.2) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .host-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 2;
    }

    .host-container {
      width: 100%;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
    }

    /* ========== CSS: 대각선 선 (좌상단) ========== */
    .line-top-left {
      position: absolute;
      width: 500px;
      height: 150px;
      top: -30px;
      left: -80px;
      background: linear-gradient(135deg, transparent 48%, #FFFFFF 48%, #FFFFFF 52%, transparent 52%);
      opacity: 0.25;
      z-index: 3;
      pointer-events: none;
    }

    /* ========== CSS: 대각선 선 (우하단) ========== */
    .line-bottom-right {
      position: absolute;
      width: 600px;
      height: 180px;
      bottom: -50px;
      right: -100px;
      background: linear-gradient(45deg, transparent 48%, #FFFFFF 48%, #FFFFFF 52%, transparent 52%);
      opacity: 0.25;
      z-index: 3;
      pointer-events: none;
    }

    /* ========== 이미지 에셋: 주먹 (좌상단) ========== */
    .halftone-fist {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 280px;
      height: 280px;
      z-index: 4;
      pointer-events: none;
    }

    /* ========== 이미지 에셋: 사람 실루엣 (우하단) ========== */
    .halftone-silhouette {
      position: absolute;
      bottom: 40px;
      right: 30px;
      width: 250px;
      height: 250px;
      z-index: 4;
      pointer-events: none;
    }

    /* ========== 메인 컨텐츠 ========== */
    .main-content {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 1000px;
      text-align: center;
    }

    /* ========== CSS: BACKSTAB 로고 ========== */
    .backstep-title {
      font-size: 5.5rem;
      font-weight: 900;
      color: #FFFFFF;
      text-shadow:
        4px 4px 0px #000000,
        -2px -2px 0px #000000,
        2px -2px 0px #000000,
        -2px 2px 0px #000000;
      letter-spacing: 16px;
      margin-bottom: 30px;
      text-transform: uppercase;
      font-family: 'Arial Black', sans-serif;
    }

    /* ========== CSS: 방관 놀기 박스 ========== */
    .subtitle-box {
      display: inline-block;
      border: 4px solid #FFFFFF;
      border-radius: 25px;
      padding: 20px 50px;
      background: rgba(0,0,0,0.4);
      margin-bottom: 60px;
    }

    .subtitle-text {
      font-size: 2rem;
      color: #FFFFFF;
      font-weight: 700;
      letter-spacing: 4px;
    }

    /* ========== 로비 섹션 ========== */
    .lobby-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-top: 40px;
      width: 100%;
    }

    .lobby-left, .lobby-right {
      background: rgba(0,0,0,0.4);
      border: 3px solid #FFFFFF;
      border-radius: 15px;
      padding: 40px;
      text-align: left;
    }

    .section-label {
      font-size: 0.85rem;
      color: #CCCCCC;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
      font-weight: 700;
    }

    .room-code {
      font-size: 4rem;
      font-weight: 900;
      color: #FFD700;
      text-shadow: 3px 3px 0px #000000;
      letter-spacing: 12px;
      margin-bottom: 20px;
      font-family: 'Courier New', monospace;
    }

    .player-count {
      font-size: 1.3rem;
      color: #FFFFFF;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .desc-text {
      color: #CCCCCC;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .player-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 10px;
    }

    .player-item {
      background: rgba(255,255,255,0.08);
      border: 2px solid #FFFFFF;
      border-radius: 8px;
      padding: 12px 15px;
      color: #FFFFFF;
      font-weight: 600;
      font-size: 1rem;
    }

    .button-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    /* ========== CSS: 버튼 ========== */
    button {
      background: rgba(0,0,0,0.3);
      border: 3px solid #FFFFFF;
      color: #FFFFFF;
      padding: 16px 28px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      transition: all 0.3s ease;
      text-shadow: 2px 2px 0px #000000;
      flex: 1;
    }

    button:hover:not(:disabled) {
      background: rgba(255,255,255,0.15);
      box-shadow: 0 0 25px rgba(255,255,255,0.4);
      transform: translateY(-3px);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .error {
      color: #FF6B6B;
      font-weight: 700;
      margin-top: 10px;
    }

    #gameSection { display: none; }

    @media (max-width: 768px) {
      .lobby-container { grid-template-columns: 1fr; }
      .backstep-title { font-size: 3rem; letter-spacing: 8px; }
      .room-code { font-size: 2.5rem; letter-spacing: 8px; }
      .halftone-fist, .halftone-silhouette { display: none; }
    }
  </style>
</head>
<body>
  <!-- CSS: 대각선 선 -->
  <div class="line-top-left"></div>
  <div class="line-bottom-right"></div>

  <!-- 이미지 에셋: SVG -->
  <img class="halftone-fist" src="/halftone-fist.svg" alt="fist halftone" />
  <img class="halftone-silhouette" src="/halftone-silhouette.svg" alt="silhouette halftone" />

  <div class="host-wrapper">
    <div class="host-container">
      <div class="main-content">
        <!-- CSS: 로고 -->
        <div class="backstep-title">BACKSTAB</div>
        <div class="subtitle-box">
          <div class="subtitle-text">방관 놀기</div>
        </div>

        <!-- 로비 화면 -->
        <div id="lobbyScreen" class="lobby-container">
          <div class="lobby-left">
            <div class="section-label">방 번호</div>
            <div class="room-code" id="roomCodeDisplay">----</div>
            <div class="player-count" id="playerCountDisplay">0/8 명</div>
            <div class="desc-text">플레이어는 /player에서<br>이 코드로 입장합니다</div>
          </div>

          <div class="lobby-right">
            <div class="section-label">입장한 플레이어</div>
            <ul class="player-list" id="lobbyPlayerList"></ul>
            <div class="button-group">
              <button id="startBtn" disabled>시작하기</button>
            </div>
            <div class="button-group">
              <button id="createRoomBtn">새 방 만들기</button>
            </div>
            <p class="error" id="errorLabel"></p>
          </div>
        </div>

        <div id="gameSection"></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared.js"></script>
  <script src="/host.js"></script>
</body>
</html>
