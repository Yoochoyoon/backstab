<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>진행자 - Backstab</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 어느 화면에 있든 항상 눌러서 방을 나갈 수 있게 고정 위치에 둔다. -->
  <button id="leaveGameBtn" class="leave-game-btn" type="button">나가기</button>

  <!-- 방 만들기 전: Figma 랜딩 화면 -->
  <section id="createSection" class="hero hero--stack">
    <div class="hero-card"></div>
    <img class="hero-fist" src="/assets/fist.webp" alt="" />
    <h1 class="hero-title">BACKSTAB</h1>
    <button id="createRoomBtn" class="hero-cta">새 방 만들기</button>
    <!-- 서버 재시작으로 이전 방이 사라졌을 때의 안내. errorLabel은 대기실 안에 있어서
         이 화면에서는 안 보이므로 별도로 둔다. -->
    <p class="error create-error" id="createErrorLabel"></p>
  </section>

  <!-- 방 생성 후 대기실 -->
  <section id="lobbySection" class="hero lobby-hero" style="display: none">
    <div class="hero-card"></div>
    <h2 class="lobby-title">입장한 플레이어</h2>
    <div class="lobby-grid" id="playerList">
      <ul class="lobby-row" id="lobbyRowTop"></ul>
      <ul class="lobby-row" id="lobbyRowBottom"></ul>
    </div>
    <div class="lobby-code">
      <span class="lobby-code__label">방코드</span>
      <span class="lobby-code__value" id="roomCode">----</span>
    </div>
    <button id="startBtn" class="lobby-start-btn" disabled>시작</button>
    <p class="error lobby-error" id="errorLabel"></p>
  </section>

  <!-- 게임 진행 화면 -->
  <section id="gameControlSection" class="host-layout" style="display: none" data-phase="lobby">
    <div class="hero-card"></div>
    <div class="tv-upper">
      <div class="progress-logo">BACKSTAB</div>

      <div class="top-line">
        <div class="case-badge">
          <span class="case-badge__label">사건 번호</span>
          <span class="case-badge__case-word">CASE</span>
          <span class="case-badge__value" id="caseNumber">#----</span>
        </div>

        <div class="phase-bar">
          <span class="phase-bar__label" id="phaseLabel">대기실</span>
          <div class="phase-icons">
            <span class="phase-icon" data-icon="night">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
            </span>
            <span class="phase-icon" data-icon="discussion">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" />
              </svg>
            </span>
            <span class="phase-icon" data-icon="vote">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="3" />
                <path d="M7 12.5l3 3 7-7" />
              </svg>
            </span>
          </div>
        </div>

        <div class="progress-timer" id="timerLabel">--:--</div>
      </div>

      <div class="hp-monitor">
        <span class="hp-monitor__label">참가자 HP 모니터</span>
        <div class="hp-monitor__grid" id="playerGrid"></div>
      </div>

      <!-- 오른쪽 열: 결과를 위에 크게 두고 보스 카드는 그 아래로 낮춘다.
           예전엔 결과가 화면 맨 아래 버튼 위에 눌려 거의 안 보였다. -->
      <div class="tv-right">
        <div id="resultLog" class="result-panel"></div>

        <div class="boss-sticker" id="bossBanner" style="display: none">
          <span class="boss-sticker__submit-badge">✓ 제출완료</span>
          <div class="boss-sticker__avatar" id="bossAvatar"></div>
          <div class="boss-sticker__body">
            <span class="boss-sticker__label">보스</span>
            <div class="boss-sticker__name" id="bossName"></div>
            <div class="boss-sticker__hp-text" id="bossHpText"></div>
            <div class="boss-sticker__pips" id="bossHpPips"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 찬반 심판 중 지목된 사람을 화면 가운데에 크게 띄운다(수배 포스터 연출).
         .tv-upper가 z-index를 가진 별도 쌓임 맥락이라 그 안에 두면 어둡게 덮는
         배경(.host-layout::after) 위로 올라올 수 없어서, 여기 바깥에 형제로 둔다. -->
    <div class="judgement-poster" id="judgementPoster" style="display: none">
      <span class="judgement-poster__label">최종 심판</span>
      <div class="judgement-poster__name" id="judgementPosterName"></div>
      <div class="judgement-poster__sub" id="judgementPosterSub">처단할지 찬반 투표 중</div>
      <!-- 찬성/반대에 누가 서 있는지 실시간으로 채워진다 (state:vote_progress). -->
      <div id="judgementPosterTally"></div>
    </div>

    <div class="control-lower">
      <div id="winnerLabel" style="display: none"></div>
      <div class="control-buttons">
        <button id="extendBtn" class="btn-extend">시간 연장</button>
        <button id="advanceBtn" class="btn-advance">다음 단계로</button>
      </div>
    </div>
  </section>

  <!-- 페이즈 전환 슬라이드 (밤 시작/결과공개/투표시작/투표결과) -->
  <div id="phaseSlide" class="phase-slide" style="display:none"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared.js"></script>
  <script src="/host.js"></script>
</body>
</html>
