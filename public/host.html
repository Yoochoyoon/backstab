<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>진행자 - Backstab</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #6B2E2E 0%, #8B4545 50%, #6B2E2E 100%);
      background-image:
        radial-gradient(circle, rgba(0,0,0,0.4) 2px, transparent 2px),
        linear-gradient(135deg, #6B2E2E 0%, #8B4545 50%, #6B2E2E 100%);
      background-size: 25px 25px, 100% 100%;
      background-attachment: fixed;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .host-container {
      width: 100%;
      max-width: 1280px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    /* BACKSTEP 타이틀 */
    .title-section {
      text-align: center;
    }

    .backstep-title {
      font-size: 4rem;
      font-weight: 900;
      color: #FFFFFF;
      text-shadow: 3px 3px 0px #000000, -1px -1px 0px #000000;
      letter-spacing: 8px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .subtitle-box {
      display: inline-block;
      border: 3px solid #FFFFFF;
      border-radius: 15px;
      padding: 12px 30px;
      background: rgba(0,0,0,0.2);
    }

    .subtitle-text {
      font-size: 1.5rem;
      color: #FFFFFF;
      font-weight: 700;
      letter-spacing: 3px;
    }

    /* 로비 섹션 */
    .lobby-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-top: 30px;
    }

    .lobby-left, .lobby-right {
      background: rgba(0,0,0,0.3);
      border: 3px solid #FFFFFF;
      border-radius: 10px;
      padding: 30px;
    }

    .section-label {
      font-size: 0.9rem;
      color: #CCCCCC;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
      font-weight: 600;
    }

    h2 {
      font-size: 2rem;
      color: #FFFFFF;
      font-weight: 900;
      margin-bottom: 20px;
      text-shadow: 2px 2px 0px #000000;
    }

    .room-code {
      font-size: 3rem;
      font-weight: 900;
      color: #FFD700;
      text-shadow: 2px 2px 0px #000000;
      letter-spacing: 10px;
      margin-bottom: 20px;
      font-family: 'Courier New', monospace;
    }

    .player-count {
      font-size: 1.2rem;
      color: #FFFFFF;
      margin-bottom: 20px;
    }

    .player-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      max-height: 200px;
      overflow-y: auto;
    }

    .player-item {
      background: rgba(255,255,255,0.1);
      border: 2px solid #FFFFFF;
      border-radius: 5px;
      padding: 12px 15px;
      color: #FFFFFF;
      font-weight: 600;
    }

    .button-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    button {
      background: rgba(0,0,0,0.3);
      border: 3px solid #FFFFFF;
      color: #FFFFFF;
      padding: 15px 25px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      text-shadow: 1px 1px 0px #000000;
    }

    button:hover:not(:disabled) {
      background: rgba(255,255,255,0.2);
      box-shadow: 0 0 20px rgba(255,255,255,0.3);
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error {
      color: #FF6B6B;
      font-weight: 700;
      margin-top: 10px;
    }

    /* 게임 중 화면 */
    #gameSection {
      display: none;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .game-info {
      background: rgba(0,0,0,0.3);
      border: 3px solid #FFFFFF;
      border-radius: 10px;
      padding: 20px;
      color: #FFFFFF;
      margin-bottom: 20px;
    }

    .game-info h3 {
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: #FFD700;
    }

    @media (max-width: 768px) {
      .lobby-container {
        grid-template-columns: 1fr;
      }

      .backstep-title {
        font-size: 2.5rem;
        letter-spacing: 4px;
      }

      .room-code {
        font-size: 2rem;
        letter-spacing: 5px;
      }
    }
  </style>
</head>
<body>
  <div class="host-container">
    <!-- BACKSTEP 타이틀 -->
    <div class="title-section">
      <div class="backstep-title">BACKSTAB</div>
      <div class="subtitle-box">
        <div class="subtitle-text">방관 놀기</div>
      </div>
    </div>

    <!-- 로비 화면 -->
    <div id="lobbyScreen" class="lobby-container">
      <!-- 왼쪽: 방 정보 -->
      <div class="lobby-left">
        <div class="section-label">방 번호</div>
        <div class="room-code" id="roomCodeDisplay">----</div>
        <div class="player-count" id="playerCountDisplay">0/8 명</div>
        <div style="color: #CCCCCC; font-size: 0.9rem;">
          플레이어는 /player에서<br>이 코드로 입장합니다
        </div>
      </div>

      <!-- 오른쪽: 플레이어 목록 및 시작 -->
      <div class="lobby-right">
        <div class="section-label">입장한 플레이어</div>
        <ul class="player-list" id="lobbyPlayerList"></ul>
        <div class="button-group">
          <button id="startBtn" disabled style="flex: 1;">시작하기</button>
          <button id="createRoomBtn" style="flex: 1;">새 방 만들기</button>
        </div>
        <p class="error" id="errorLabel"></p>
      </div>
    </div>

    <!-- 게임 중 화면 -->
    <div id="gameSection" style="display: none;">
      <div class="game-info">
        <h3 id="phaseLabel">라운드 1 - 낮</h3>
        <div style="font-size: 2rem; font-weight: 900; color: #FFD700;" id="timerLabel">--:--</div>
      </div>

      <div id="bossBanner" style="display:none; background: rgba(0,0,0,0.3); border: 3px solid #FFD700; border-radius: 10px; padding: 20px; margin-bottom: 20px;">
        <div style="color: #CCCCCC; font-size: 0.9rem; text-transform: uppercase; margin-bottom: 10px;">보스 공개</div>
        <div id="bossName" style="font-size: 2.5rem; font-weight: 900; color: #FFD700;"></div>
      </div>

      <div class="game-grid" id="gamePlayerGrid"></div>

      <div id="resultLog" style="background: rgba(0,0,0,0.3); border: 3px solid #FFFFFF; border-radius: 10px; padding: 20px; color: #FFFFFF; margin-top: 20px; min-height: 100px;"></div>

      <div class="button-group" style="margin-top: 20px;">
        <button id="advanceBtn" style="flex: 1;">다음 단계로</button>
        <button id="extendBtn" style="flex: 1;">시간 연장 (+1분)</button>
      </div>
    </div>

    <!-- 게임 종료 화면 -->
    <div id="endSection" style="display: none;">
      <div id="winnerLabel" style="text-align: center; font-size: 2.5rem; font-weight: 900; color: #FFD700; text-shadow: 2px 2px 0px #000000; margin-bottom: 30px;"></div>
      <div class="game-grid" id="endPlayerGrid"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared.js"></script>
  <script src="/host.js"></script>
</body>
</html>
