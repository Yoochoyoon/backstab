<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>플레이어 - Backstab</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 방 코드 / 닉네임 입력 화면 -->
  <section id="joinSection" class="hero hero--stack join-hero">
    <div class="hero-card"></div>
    <h1 class="hero-title join-title">BACKSTAB</h1>

    <div class="join-field">
      <label class="join-label" for="codeInput">방 코드를 입력해주세요.</label>
      <input id="codeInput" class="join-input join-input--pill" placeholder="코드 입력" maxlength="4" style="text-transform:uppercase" />
    </div>

    <div class="join-field">
      <label class="join-label" for="nicknameInput">이름을 입력해주세요. (최대 7자)</label>
      <input id="nicknameInput" class="join-input join-input--underline" placeholder="이름 입력" maxlength="7" />
    </div>

    <button id="joinBtn" class="join-start-btn">입장하기</button>
    <p class="error join-error" id="errorLabel"></p>
  </section>

  <div class="screen" id="postJoinScreen" style="display:none">
    <div id="waitingSection" class="card" style="display:none">
      <p>대기 중... 진행자가 시작하면 자동으로 시작됩니다.</p>
    </div>

    <div id="bossBanner" class="card" style="display:none; border:1px solid #f2c94c;">
      <span class="muted">보스 공개</span>
      <div id="bossName" style="font-size:1.2rem;font-weight:700;"></div>
    </div>

    <div id="roleCard" class="card" style="display:none">
      <span class="muted">내 역할</span>
      <div class="role-name" id="roleName"></div>
      <div class="hp-bar"><div id="hpBarFill"></div></div>
      <span class="muted" id="hpLabel"></span>
    </div>

    <div id="spyRevealSection" class="card" style="display:none; border:1px solid #f2c94c;">
      <span class="muted">스파이 동료 (1라운드 정찰 결과)</span>
      <ul id="spyTeammateList" class="player-list"></ul>
    </div>

    <div id="gameSection" class="card" style="display:none">
      <h2 id="phaseLabel"></h2>
      <div class="timer" id="timerLabel">--:--</div>
      <p class="muted" id="instructionLabel"></p>
      <p id="beginnerHint" style="display:none; color:#f2c94c;"></p>
      <ul id="actionChoices" class="player-list" style="display:none"></ul>
      <ul id="shieldModeChoices" class="player-list" style="display:none"></ul>
      <ul id="targetList" class="player-list"></ul>
      <button id="submitBtn" style="display:none">지목 확정</button>
    </div>

    <div id="resultSection" class="card" style="display:none">
      <h3>결과</h3>
      <div id="resultLog"></div>
    </div>

    <div id="overSection" class="card" style="display:none">
      <h2>게임 종료</h2>
      <p id="winnerLabel"></p>
      <p class="muted" id="myRoleReveal"></p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared.js"></script>
  <script src="/player.js"></script>
</body>
</html>
