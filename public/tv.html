<!doctype html>
<html lang="ko" class="tv">
<head>
  <meta charset="UTF-8" />
  <title>TV - Backstab</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="tv-screen">
    <h1 id="titleLabel">Backstab</h1>

    <div id="joinBar" style="margin-bottom:24px;">
      <input id="codeInput" placeholder="방 코드" maxlength="4" style="width:160px;display:inline-block;text-transform:uppercase" />
      <button id="joinBtn" style="width:auto;display:inline-block;">TV로 연결</button>
    </div>

    <div id="roomCodeLabel" class="muted" style="font-size:1.5rem"></div>

    <div id="bossBanner" style="display:none; margin: 16px 0;">
      <span class="muted">보스 공개</span>
      <div id="bossName" style="font-size:2.5rem;font-weight:700;color:#f2c94c;"></div>
    </div>

    <h2 id="phaseLabel"></h2>
    <div class="timer" id="timerLabel"></div>
    <div id="resultLog" style="font-size:1.4rem; margin: 16px 0;"></div>

    <div id="winnerLabel" style="font-size:2rem; font-weight:700; display:none;"></div>

    <div class="tv-grid" id="playerGrid"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared.js"></script>
  <script src="/tv.js"></script>
</body>
</html>
