<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- 빨강/검정 망점 배경 -->
  <defs>
    <pattern id="halftone-red-black" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="5" fill="none" stroke="#CC3333" stroke-width="2"/>
      <circle cx="14" cy="14" r="5" fill="none" stroke="black" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- 사람 실루엣 -->
  <g transform="translate(30, 20)">
    <!-- 머리 -->
    <circle cx="70" cy="30" r="25" fill="#CC3333" stroke="black" stroke-width="3"/>
    <!-- 몸 -->
    <rect x="50" y="60" width="40" height="60" fill="black" stroke="black" stroke-width="3" rx="5"/>
    <!-- 팔 왼쪽 -->
    <rect x="20" y="65" width="30" height="15" fill="#CC3333" stroke="black" stroke-width="3" rx="7"/>
    <!-- 팔 오른쪽 -->
    <rect x="95" y="65" width="30" height="15" fill="black" stroke="black" stroke-width="3" rx="7"/>
    <!-- 다리 왼쪽 -->
    <rect x="55" y="125" width="12" height="50" fill="#CC3333" stroke="black" stroke-width="3"/>
    <!-- 다리 오른쪽 -->
    <rect x="73" y="125" width="12" height="50" fill="black" stroke="black" stroke-width="3"/>
    <!-- 망점 오버레이 -->
    <circle cx="60" cy="40" r="3" fill="#CC3333" opacity="0.6"/>
    <circle cx="75" cy="80" r="4" fill="black" opacity="0.6"/>
    <circle cx="50" cy="100" r="2" fill="#CC3333" opacity="0.6"/>
  </g>

  <!-- 테두리 -->
  <rect x="5" y="5" width="290" height="290" fill="none" stroke="white" stroke-width="4" rx="20"/>
</svg>