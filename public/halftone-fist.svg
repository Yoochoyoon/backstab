<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 흑백 망점 -->
  <defs>
    <pattern id="halftone-bw" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="6" fill="white"/>
      <circle cx="15" cy="15" r="6" fill="black"/>
    </pattern>
  </defs>

  <!-- 주먹 실루엣 -->
  <g transform="translate(50, 50)">
    <!-- 팔뚝 -->
    <rect x="20" y="100" width="60" height="50" fill="white" stroke="black" stroke-width="3"/>
    <!-- 손가락 -->
    <rect x="20" y="20" width="15" height="80" fill="white" stroke="black" stroke-width="3"/>
    <rect x="40" y="15" width="15" height="85" fill="white" stroke="black" stroke-width="3"/>
    <rect x="60" y="20" width="15" height="80" fill="white" stroke="black" stroke-width="3"/>
    <!-- 엄지 -->
    <rect x="80" y="60" width="15" height="50" fill="white" stroke="black" stroke-width="3"/>
    <!-- 망점 오버레이 -->
    <circle cx="40" cy="40" r="4" fill="black" opacity="0.4"/>
    <circle cx="65" cy="50" r="3" fill="black" opacity="0.4"/>
    <circle cx="50" cy="80" r="5" fill="black" opacity="0.4"/>
    <circle cx="70" cy="90" r="3" fill="black" opacity="0.4"/>
  </g>

  <!-- 테두리 -->
  <circle cx="150" cy="150" r="145" fill="none" stroke="white" stroke-width="4"/>
</svg>